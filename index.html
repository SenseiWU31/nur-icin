<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff4f5" />
    <meta name="description" content="Nur için küçük bir soru…" />
    <title>Nur, benimle çıkar mısın?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="proposal.js" defer></script>
  </head>
  <body class="proposal-page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div id="heart-field" class="heart-field" aria-hidden="true"></div>
    <main class="proposal-shell">
      <section class="proposal-card" aria-labelledby="proposal-title">
        <div class="tiny-heart" aria-hidden="true">♥</div>
        <p class="eyebrow">Sana küçük bir sorum var</p>
        <h1 id="proposal-title">Benimle çıkar mısın,<br /><span>Nur?</span></h1>
        <p class="subline">Cevabın ne olursa olsun, bu an benim için çok özel. ♡</p>
        <div class="button-playground" id="button-playground">
          <a class="answer-button yes-button" id="yes-button" href="letter.html">Evet <span aria-hidden="true">♡</span></a>
          <button class="answer-button no-button" id="no-button" type="button">Hayır</button>
        </div>
        <p class="signature">kalbimden, sana <span aria-hidden="true">♥</span></p>
      </section>
      <p class="page-note">Senin için sevgiyle hazırlandı</p>
    </main>
  </body>
